---
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSetBinding
metadata:
  name: default
  namespace: policies
spec:
  clusterSet: default
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: dev-resource-quota
  namespace: policies
  annotations:
    policy.open-cluster-management.io/standards: NIST SP 800-53
    policy.open-cluster-management.io/categories: SC System and Communications Protection
    policy.open-cluster-management.io/controls: SC-6 Resource Availability
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: dev-resource-quota
        spec:
          remediationAction: enforce
          severity: medium
          namespaceSelector:
            matchLabels:
              env: dev
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ResourceQuota
                metadata:
                  name: dev-quota
                spec:
                  hard:
                    requests.cpu: "4"
                    requests.memory: 4Gi
                    limits.cpu: "8"
                    limits.memory: 8Gi
                    pods: "20"
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: dev-resource-quota-placement
  namespace: policies
spec:
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: name
              operator: In
              values:
                - local-cluster
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: dev-resource-quota-binding
  namespace: policies
placementRef:
  name: dev-resource-quota-placement
  kind: Placement
  apiGroup: cluster.open-cluster-management.io
subjects:
  - name: dev-resource-quota
    kind: Policy
    apiGroup: policy.open-cluster-management.io
